<svg xmlns="http://www.w3.org/2000/svg" width="840" height="190" viewBox="0 0 840 190" role="img" aria-label="Terminal window typing the whoami command. Output: John 'jam' Agustin, software developer from the Philippines.">
  <style>
    text {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      fill: #e6edf3;
    }
    .title { font-size: 12px; fill: #8b949e; }
    .g { fill: #3fb950; }
    .b { fill: #58a6ff; }
    .m { fill: #8b949e; }
    .name { font-weight: 600; }
    .ch { opacity: 0; animation: on 0.01s linear forwards; }
    .c1 { animation-delay: 0.5s; }
    .c2 { animation-delay: 0.62s; }
    .c3 { animation-delay: 0.74s; }
    .c4 { animation-delay: 0.86s; }
    .c5 { animation-delay: 0.98s; }
    .c6 { animation-delay: 1.1s; }
    .out1 { opacity: 0; animation: on 0.01s linear 1.6s forwards; }
    .out2 { opacity: 0; animation: on 0.01s linear 1.85s forwards; }
    .prompt2 { opacity: 0; animation: on 0.01s linear 2.4s forwards; }
    .cursor { opacity: 0; animation: blink 1.1s steps(2, jump-none) 2.4s infinite; }
    @keyframes on { to { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ch, .out1, .out2, .prompt2 { animation: none; opacity: 1; }
      .cursor { animation: none; opacity: 1; }
    }
  </style>

  <rect x="0.5" y="0.5" width="839" height="189" rx="12" fill="#0d1117"/>
