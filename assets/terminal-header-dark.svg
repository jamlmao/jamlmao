  <text x="24" y="70"><tspan class="g">jam@github</tspan><tspan>:</tspan><tspan class="b">~</tspan><tspan>$ </tspan><tspan class="ch c1">w</tspan><tspan class="ch c2">h</tspan><tspan class="ch c3">o</tspan><tspan class="ch c4">a</tspan><tspan class="ch c5">m</tspan><tspan class="ch c6">i</tspan></text>

